<div class="confirm-dialog-container">
  <h2 mat-dialog-title>{{ data?.title }}</h2>
  <mat-dialog-content>
    <p>{{ data?.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">{{ data?.cancelText || 'Voltar' }}</button>
    <button mat-flat-button [color]="data?.type ? 'warn' : ''" (click)="onConfirm()">
      {{ data?.confirmText || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
