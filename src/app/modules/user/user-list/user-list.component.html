<div class="container">
  <header class="page-header">
    <div class="page-header-top">
      <h2>Gerenciamento de usuários</h2>
      <button
        mat-icon-button
        (click)="toggleDarkMode()"
        aria-label="Alternar modo claro/escuro"
        [title]="isDarkMode() ? 'Modo claro' : 'Modo escuro'"
      >
        <mat-icon>
          @if (isDarkMode()) {
            light_mode
          } @else {
            dark_mode
          }
        </mat-icon>
      </button>
    </div>

    <div class="page-actions">
      <mat-form-field class="search-field" appearance="outline" subscriptSizing="dynamic">
        <input
          matInput
          [value]="searchQuery()"
          (input)="onSearchChange($any($event.target).value)"
          placeholder="Pesquisar usuários..."
        />

        @if (searchQuery()) {
          <button mat-icon-button matSuffix (click)="clearSearch()">
            <mat-icon>close</mat-icon>
          </button>
        }
      </mat-form-field>

      <button mat-flat-button color="primary" (click)="openUserCreateEditDialog()">
        <mat-icon>add</mat-icon> Novo usuário
      </button>
    </div>
  </header>

  @if (isLoading()) {
    <div class="loading-wrapper">
      <mat-spinner></mat-spinner>
    </div>
  }

  @if (showTable()) {
    <table mat-table [dataSource]="users()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef="let user">Nome</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef="let user">E-mail</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef="let user">Cargo</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef="let user">Status</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set>
            <mat-chip [class.chip-active]="user.status === EUserStatus.ACTIVE">
              {{ user.status === EUserStatus.ACTIVE ? 'Ativo' : 'Inativo' }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef="">Ações</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="openUserCreateEditDialog(user)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDeleteUserDialog(user)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="totalUsers()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      aria-label="Select page"
    >
    </mat-paginator>
  }

  @if (isDatabaseEmpty()) {
    <app-empty-state subtitle="Comece adicionando um novo usuário." />
  }

  @if (isSearchEmpty()) {
    <app-empty-state
      icon="search_off"
      title="Nenhum usuário encontrado"
      subtitle="Tente ajustar os termos da sua busca."
    />
  }
</div>
