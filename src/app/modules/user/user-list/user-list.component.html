<div class="container">
  <header class="page-header">
    <h2>Gerenciamento de usuários</h2>
    <button mat-flat-button color="primary" (click)="openUserCreateEditDialog()">
      <mat-icon>add</mat-icon> Novo usuário
    </button>
  </header>

  @if (isLoading()) {
    <div class="loading-wrapper">
      <mat-spinner></mat-spinner>
    </div>
  }

  @if (!isLoading() && users().length > 0) {
    <table mat-table [dataSource]="users()" class="mat-elevation-z4">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef="let user">Nome</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef="let user">E-mail</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef="let user">Cargo</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef="let user">Status</th>
        <td mat-cell *matCellDef="let user">{{ user.status }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef="">Ações</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="openUserCreateEditDialog(user)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteUser(user)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }

  @if (!isLoading() && users().length === 0) {
    <p>Nenhum usuário encontrado.</p>
  }
</div>
